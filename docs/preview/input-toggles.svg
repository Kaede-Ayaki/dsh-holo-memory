<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="输入框读取与写入双开关示意图">
  <title>输入框读取与写入双开关示意图</title>
  <desc>Synthetic UI mockup with example data; contains no real memory content.</desc>
  <rect width="1000" height="300" fill="#0b1220"/>

  <rect x="1" y="1" width="998" height="298" rx="16" fill="#0b1220" stroke="#263450" stroke-width="1"/>
  <rect x="40" y="44" width="920" height="150" rx="14" fill="#0f182b" stroke="#263450" stroke-width="1"/>
  <text x="64" y="82" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif" font-size="13" fill="#8996b3" font-weight="400" text-anchor="start">给 DeepSeek 发送消息…</text>
  <g transform="translate(64,148) scale(1.25)"><path d="M9.5 5 5.6 9a1.9 1.9 0 0 0 2.7 2.7l4.4-4.4a3.2 3.2 0 0 0-4.5-4.5L3.9 7.1" fill="none" stroke="#8996b3" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="110" y="160" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif" font-size="12.5" fill="#e8eeff" font-weight="600" text-anchor="start">读</text>
  <rect x="132" y="143" width="44" height="24" rx="12" fill="#5b7cfa"/>
  <circle cx="162" cy="155" r="9" fill="#ffffff"/>
  <text x="184" y="159" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#4ade80" font-weight="500" text-anchor="start">开</text>
  <text x="216" y="160" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif" font-size="12.5" fill="#e8eeff" font-weight="600" text-anchor="start">写</text>
  <rect x="238" y="143" width="44" height="24" rx="12" fill="#5b7cfa"/>
  <circle cx="268" cy="155" r="9" fill="#ffffff"/>
  <text x="290" y="159" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#4ade80" font-weight="500" text-anchor="start">开</text>
  <rect x="760" y="140" width="78" height="30" rx="8" fill="#142039" stroke="#263450" stroke-width="1"/>
  <text x="799" y="160" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#a8b4cf" font-weight="600" text-anchor="middle">JSON</text>
  <rect x="858" y="136" width="78" height="38" rx="10" fill="#5b7cfa"/>
  <g transform="translate(886,147) scale(1.0)"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="#ffffff" stroke-width="1.50" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="40" y="224" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif" font-size="11.5" fill="#22d3ee" font-weight="700" text-anchor="start">读</text>
  <text x="60" y="224" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif" font-size="11.5" fill="#a8b4cf" font-weight="400" text-anchor="start">关掉后不自动召回、不注入记忆（手动 memory_recall 仍可用）</text>
  <text x="40" y="248" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif" font-size="11.5" fill="#f5b84c" font-weight="700" text-anchor="start">写</text>
  <text x="60" y="248" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif" font-size="11.5" fill="#a8b4cf" font-weight="400" text-anchor="start">关掉后不捕获回合、不蒸馏、不写向量与神经元反馈</text>
  <text x="40" y="272" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11" fill="#8996b3" font-weight="400" text-anchor="start">状态由 Host 持有并持久化：$DSH_HOME/holo-memory/runtime-toggles.json</text>
